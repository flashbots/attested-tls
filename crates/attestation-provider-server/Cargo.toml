[package]
name = "attestation-provider-server"
description = "A Unix socket server which provides attestations"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
repository = "https://github.com/flashbots/attested-tls"

[lints]
workspace = true

[dependencies]
attestation = { workspace = true }
tokio = { workspace = true, features = ["net", "io-util", "signal", "macros", "rt-multi-thread"] }
rustls = { workspace = true, default-features = false, features = ["aws_lc_rs"] }

clap = { version = "4.5.51", features = ["derive", "env"] }
anyhow = "1.0.100"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }

nix = { version = "=0.26.4", default-features = false, features = ["user"] }

[dev-dependencies]
tempfile = "3.23.0"
