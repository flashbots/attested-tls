[package]
name = "attestation"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Attestation generation and verification, and measurement policy handling"
repository = "https://github.com/flashbots/attested-tls"
keywords = ["attestation", "CVM", "TDX"]

[dependencies]
dcap-qvl = { workspace = true, features = ["danger-allow-tcb-override"] }
pccs = { workspace = true }
mock-tdx = { workspace = true, optional = true }
tokio = { workspace = true, features = ["fs", "rt", "rt-multi-thread", "time"] }
tokio-rustls = { workspace = true, default-features = false }
attest-types = { git = "https://github.com/easy-tee/attest.git", rev = "12f1e29f6ea63ecc2f80f39c2c1f1172720bcf24" }
attest-measure = { git = "https://github.com/easy-tee/attest.git", rev = "12f1e29f6ea63ecc2f80f39c2c1f1172720bcf24" }

anyhow = "1.0.100"
pem-rfc7468 = { version = "0.7.0", features = ["std"] }
tdx-attest = { git = "https://github.com/Dstack-TEE/dstack.git", rev = "4f602dddc0542cd34da031c90ac0b3a560f316ed" }
base64 = "0.22.1"
hex = "0.4.3"
http = "1.3.1"
num-bigint = "0.4.6"
once_cell = "1.21.3"
parity-scale-codec = "3.7.5"
rand_core = { version = "0.6.4", features = ["getrandom"] }
reqwest = { workspace = true }
serde = "1.0.228"
serde_json = "1.0.145"
thiserror = "2.0.17"
time = "0.3.47"
tracing = "0.1.41"
ureq = "2.12.1"
webpki = { package = "rustls-webpki", version = "0.103.8" }
x509-parser = "0.18.0"

# Needed for verification of azure vTPM evidence. No features on purpose since az-cvm-vtpm's
# verifier feature implies its `tpm` one, which pulls tss-esapi and the native TPM libraries.
# See https://github.com/kinvolk/azure-cvm-tooling/issues/95
az-cvm-vtpm = { version = "0.7.4", default-features = false, optional = true }
openssl = { version = "0.10.79", optional = true }

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
# Needed for generation of azure vTPM evidence, which reads the vTPM through tss-esapi and
# attests Intel TDX. An Azure TDX CVM is x86_64 linux, so the generation code is only
# meaningful there, and neither of these builds elsewhere in any case.
# Declaring them per-target rather than gating on the feature alone keeps `azure-attester`
# (and so --all-features) resolvable on every platform; off this target the feature stays
# enabled but contributes nothing, as the crate readme describes. build.rs derives the matching
# `azure_attester_x86_64_linux` cfg, and must keep the same condition as this table.
# See https://github.com/virtee/sev/issues/369
az-tdx-vtpm = { version = "0.7.4", optional = true }
tss-esapi = { version = "7.6.0", optional = true }

[dev-dependencies]
mock-tdx = { workspace = true }
tempfile = "3.23.0"
tokio-rustls = { workspace = true, default-features = true }
rustls = { workspace = true, default-features = false, features = ["aws_lc_rs"] }

serde-saphyr = "0.0.22"

[build-dependencies]
attest-measure = { git = "https://github.com/easy-tee/attest.git", rev = "12f1e29f6ea63ecc2f80f39c2c1f1172720bcf24" }
serde_json = "1.0.145"

[features]
default = []

# Opts into generating Azure evidence, and so into the native tpm2-tss stack
# that tss-esapi links. Code should be gated on the `azure_attester_x86_64_linux` cfg
# injected by build.rs rather than on this feature, which says nothing about the target.
# The crate readme covers what enabling it does off x86_64 linux.
azure-attester = ["azure-verifier", "dep:az-tdx-vtpm", "dep:tss-esapi"]

# Verification of Microsoft Azure attestation evidence. Pure computation
# over bytes; builds and runs on any platform, including macOS.
azure-verifier = ["dep:az-cvm-vtpm", "dep:openssl"]

# Deprecated alias for `azure-attester`, kept only for backwards
# compatibility. Use `azure-attester` or `azure-verifier` instead.
azure = ["azure-attester"]

# Allows mock quotes used in tests and exposes related functions for testing
mock = ["dep:mock-tdx"]

[lints]
workspace = true
