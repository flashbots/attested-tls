[package]
name = "pccs"
version = "0.0.1"
edition = "2024"
license = "MIT"
description = "Provisioning Certificate Caching Service with pre-emptive fetching"
repository = "https://github.com/flashbots/attested-tls"

[dependencies]
tokio = { workspace = true }
time = { version = "0.3.44", features = ["parsing", "formatting"] }
dcap-qvl = { workspace = true }
tracing = "0.1.41"
thiserror = "2.0.17"
serde = "1.0.228"
serde_json = "1.0.145"
anyhow = "1.0.100"
reqwest = { workspace = true }
# No provider feature: only the process-default lookup is needed here — which
# crypto provider backs it stays the application's choice.
rustls = { workspace = true, default-features = false }
x509-parser = "0.18.0"

[dev-dependencies]
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
mock-tdx = { workspace = true }
# Tests exercise real TLS fetches against local mock servers, so they install
# a concrete provider.
rustls = { workspace = true, default-features = false, features = ["aws_lc_rs"] }
